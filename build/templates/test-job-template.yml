# Repo: FirelyTeam/firely-net-sdk
# File: build/templates/test-job-template.yml
parameters:
- name: testRunTitle
  default: 'Test'
- name: projects
- name: targetFramework

variables:
  ${{ if eq(parameters.targetFramework, 'net8.0') }}:
    sdkVersion: '8.x'
  ${{ if eq(parameters.targetFramework, 'net10.0') }}:
    sdkVersion: '10.x'

steps:
- powershell: |
    Write-Host "##[section]Starting test execution: ${{ parameters.testRunTitle }}"
    Write-Host "##[command]Target Framework: ${{ parameters.targetFramework }}"
    Write-Host "##[command]Test Projects: ${{ parameters.projects }}"
    Write-Host "##[command]Filters: TestCategory!=IntegrationTest&TestCategory!=FhirClient"
  displayName: 'Test Configuration Info'
  
- task: UseDotNet@2
  displayName: 'Use .NET SDK $(sdkVersion)'
    inputs:
      packageType: sdk
      version: $(sdkVersion)
- task: DownloadPipelineArtifact@2
  inputs:
    displayName: Download Build artifacts
    artifact: 'TestBuild_${{ parameters.targetFramework }}'
    path: $(System.DefaultWorkingDirectory)/TestBuild
    
- task: DotNetCoreCLI@2
  displayName: Running unit tests
  inputs:
    command: test
    projects: ${{ parameters.projects }}
    arguments: '-f ${{ parameters.targetFramework }} --filter TestCategory!=IntegrationTest&TestCategory!=FhirClient --collect "Code coverage"'
    testRunTitle: ${{ parameters.testRunTitle }}
    
- powershell: |
    $trxFiles = Get-ChildItem -Path $env:Agent_TempDirectory -Filter *.trx
  
    if (-not $trxFiles) {
      Write-Error "No .trx files found. Failing the build."
      exit 1
    }
    
    foreach ($file in $trxFiles) {
      [xml]$trx = Get-Content $file.FullName
      $fileTotal = [int]$trx.TestRun.ResultSummary.Counters.total
  
      if ($fileTotal -eq 0) {
        Write-Error "No tests executed in $($file.Name). Failing the build."
        exit 1
      }
    }
    
  displayName: Fail if zero tests executed
- powershell: |
    Write-Host "##[section]✓ Test execution completed: ${{ parameters.testRunTitle }}"
  displayName: 'Test Completion Status'
  condition: succeeded()