# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      # Low-risk: Test deps — patch & minor together
      test-dependencies:
        patterns:
          - "xunit*"
          - "Moq"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "MSTest.*"
        update-types:
          - "minor"
          - "patch"

      # Test deps — majors separate for careful review
      test-dependencies-major:
        patterns:
          - "xunit*"
          - "Moq"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "MSTest.*"
        update-types:
          - "major"

      # Runtime deps — patch & minor together
      runtime-dependencies-minor:
        patterns:
          - "*"
        exclude-patterns:
          - "xunit*"
          - "Moq"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "MSTest.*"
        update-types:
          - "minor"
          - "patch"

      # Runtime deps — majors separate for careful review
      runtime-dependencies-major:
        patterns:
          - "*"
        exclude-patterns:
          - "xunit*"
          - "Moq"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "MSTest.*"
        update-types:
          - "major"

    ignore:
      - dependency-name: "Moq"
      - dependency-name: "xunit"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-patch"]
      - dependency-name: Microsoft.NET.Test.Sdk
        update-types: ["version-update:semver-patch"]
      - dependency-name: MSTest.TestAdapter
        update-types: ["version-update:semver-patch"]
      - dependency-name: MSTest.TestFramework
        update-types: ["version-update:semver-patch"]
      - dependency-name: FluentAssertions
        versions: [">=8.0.0"]
