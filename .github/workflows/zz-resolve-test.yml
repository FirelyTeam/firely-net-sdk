# Throwaway: which GITHUB_TOKEN permissions can resolveReviewThread use? Test PR only.
name: zz resolve test
on:
  pull_request:
    types: [synchronize]
permissions: {}
jobs:
  pr-write-only:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' -f id=PRRT_kwDOANQ6iM61uCLC \
            && gh api graphql -f query='mutation($id: ID!) { unresolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' -f id=PRRT_kwDOANQ6iM61uCLC
  with-contents-write:
    needs: pr-write-only
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' -f id=PRRT_kwDOANQ6iM61uCLC \
            && gh api graphql -f query='mutation($id: ID!) { unresolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' -f id=PRRT_kwDOANQ6iM61uCLC
